<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Company Contact Card</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f0f0f0;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: #fff;
    }

    .site-logo {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #111;
    }

    .site-logo span {
      color: #f5a623; /* yellow accent on the "Y" */
    }

    .lang-btn {
      background: #111;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 10px 22px;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
    }

    /* ── Main ── */
    main {
      display: flex;
      justify-content: center;
      padding: 30px 16px;
    }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 36px 28px 28px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    /* Company logo circle */
    .logo-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid #111;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;
    }

    .logo-circle img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Fallback text logo when no image */
    .logo-text {
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      line-height: 1.3;
      color: #111;
      padding: 8px;
    }

    .logo-text .logo-main {
      font-size: 22px;
      letter-spacing: 2px;
    }

    .logo-text .logo-sub {
      font-size: 9px;
      letter-spacing: 1px;
      color: #c0392b;
    }

    /* Name */
    .person-name {
      font-size: 22px;
      font-weight: 900;
      text-transform: uppercase;
      color: #111;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    /* Title badge */
    .job-title {
      display: inline-block;
      background: #f0f0f0;
      border-radius: 50px;
      padding: 6px 18px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: #333;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
    }

    /* Social / contact icons row */
    .icons-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .icon-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #111;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background: #333;
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }

    /* Download button */
    .download-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 16px 28px;
      width: 100%;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 22px;
      font-family: inherit;
      transition: background 0.2s;
    }

    .download-btn:hover {
      background: #333;
    }

    .download-btn svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    /* Info rows (email / location) */
    .info-box {
      background: #f9f9f9;
      border-radius: 14px;
      padding: 16px 18px;
      text-align: left;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 0;
    }

    .info-row + .info-row {
      border-top: 1px solid #eee;
    }

    .info-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .info-icon svg {
      width: 16px;
      height: 16px;
      fill: #fff;
    }

    .info-text {
      font-size: 13px;
      color: #111;
      text-decoration: none;
      word-break: break-all;
    }

    a.info-text:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="site-logo">YOUR<span>&#9670;</span>BRAND</div>
    <button class="lang-btn" onclick="toggleLang()">العربية</button>
  </header>

  <!-- Card -->
  <main>
    <div class="card">

      <!-- Company logo -->
      <div class="logo-circle">
        <!-- Replace the div below with: <img src="your-logo.png" alt="Company Logo" /> -->
        <div class="logo-text">
          <div class="logo-main">LOGO</div>
          <div class="logo-sub">YOUR COMPANY</div>
        </div>
      </div>

      <!-- Name -->
      <h1 class="person-name">YOUR FULL NAME</h1>

      <!-- Job title badge -->
      <span class="job-title">YOUR COMPANY NAME &nbsp;·&nbsp; JOB TITLE</span>

      <!-- Contact icons -->
      <div class="icons-row">

        <!-- Phone 1 -->
        <a href="tel:+1234567890" class="icon-btn" title="Call Phone 1">
          <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
        </a>

        <!-- Phone 2 -->
        <a href="tel:+0987654321" class="icon-btn" title="Call Phone 2">
          <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
        </a>

        <!-- Instagram -->
        <a href="https://instagram.com/yourhandle" class="icon-btn" title="Instagram" target="_blank">
          <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
        </a>

        <!-- WhatsApp -->
        <a href="https://wa.me/1234567890" class="icon-btn" title="WhatsApp" target="_blank">
          <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        </a>

      </div>

      <!-- Download contact card button -->
      <button class="download-btn" onclick="downloadVCard()">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        Download Contact Card
      </button>

      <!-- Email & Location -->
      <div class="info-box">

        <div class="info-row">
          <div class="info-icon">
            <!-- Envelope icon -->
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          </div>
          <a href="mailto:yourname@example.com" class="info-text">yourname@example.com</a>
        </div>

        <div class="info-row">
          <div class="info-icon">
            <!-- Location pin icon -->
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          </div>
          <span class="info-text">Your City, Your Country</span>
        </div>

      </div>
    </div>
  </main>

  <script>
    /* ── Language toggle (EN / AR) ── */
    let isArabic = false;

    const translations = {
      en: {
        langBtn:     'العربية',
        name:        'YOUR FULL NAME',
        title:       'YOUR COMPANY NAME · JOB TITLE',
        download:    'Download Contact Card',
        email:       'yourname@example.com',
        location:    'Your City, Your Country',
      },
      ar: {
        langBtn:     'English',
        name:        'اسمك الكامل',
        title:       'اسم شركتك · المسمى الوظيفي',
        download:    'تحميل بطاقة التواصل',
        email:       'yourname@example.com',
        location:    'مدينتك، بلدك',
      }
    };

    function toggleLang() {
      isArabic = !isArabic;
      const t = isArabic ? translations.ar : translations.en;
      document.documentElement.lang = isArabic ? 'ar' : 'en';
      document.documentElement.dir  = isArabic ? 'rtl' : 'ltr';
      document.querySelector('.lang-btn').textContent          = t.langBtn;
      document.querySelector('.person-name').textContent       = t.name;
      document.querySelector('.job-title').textContent         = t.title;
      document.querySelector('.download-btn').innerHTML =
        `<svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:#fff"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> ${t.download}`;
      document.querySelector('a.info-text[href^="mailto"]').textContent = t.email;
      document.querySelector('.info-row:last-child .info-text').textContent = t.location;
    }

    /* ── vCard download ── */
    function downloadVCard() {
      const vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'FN:Your Full Name',
        'ORG:Your Company Name',
        'TITLE:Your Job Title',
        'TEL;TYPE=CELL:+1234567890',
        'TEL;TYPE=WORK:+0987654321',
        'EMAIL:yourname@example.com',
        'ADR;TYPE=WORK:;;Your City;;; ;Your Country',
        'URL:https://instagram.com/yourhandle',
        'END:VCARD'
      ].join('\r\n');

      const blob = new Blob([vcard], { type: 'text/vcard' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = 'contact.vcf';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
